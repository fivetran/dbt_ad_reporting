name: 🎉 Feature
description: Suggest a new feature for the Fivetran dbt package
title: "[Feature] <title>"
labels: ["type:enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using the Fivetran dbt package and for taking the time to fill out this feature request. Your contributions help improve this package for the entire community of users!
  - type: checkboxes
    attributes:
      label: Is there an existing feature request for this?
      description: Please search to see if an issue already exists for the feature you would like.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Describe the Feature
      description: A clear and concise description of what you want to happen and why you want the new feature.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How would you implement this feature?
      description: |
        How would you build out this feature with your existing data? Any code examples you can provide to help accelerate development on this issue?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: checkboxes
    id: contributing
    attributes:
      label: Are you willing to open a PR to contribute this feature?
      description: Our packages are maintained by a small team of engineers with finite capacity, and we receive more PRs than we can thoroughly review, test, and merge. Our team will assess this feature and let you know if we will add it to a future sprint. If you are willing to open a PR, we will work with you to approve and merge.
      options:
        - label: Yes.
        - label: Yes, but I will need assistance.
        - label: No.
          required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the feature you are suggesting!
    validations:
      required: false

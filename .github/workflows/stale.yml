# Labels issues and PRs with no activity as stale, then closes them if nobody responds.
# All the logic and messages live in the central workflow:
# https://github.com/fivetran/dbt_package_automations/blob/main/.github/workflows/stale-bot.yml

name: "Close stale issues"
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    uses: fivetran/dbt_package_automations/.github/workflows/stale-bot.yml@main

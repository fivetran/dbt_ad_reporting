# Test scenarios configuration for ad_reporting dbt package
# This file defines the different test scenarios to run during CI/CD

# Required: The dbt variable name that controls which schema to use for testing
schema_variable_name: "ad_reporting_schema"

# Test scenarios - FIRST MUST BE DEFAULT WITH NO VARS
dbt_adapter_versions:
  snowflake: ">=1.3.0,<2.0.0"
  bigquery: ">=1.3.0,<2.0.0"
  postgres: ">=1.3.0,<2.0.0"
  redshift: ">=1.3.0,<2.0.0"
  databricks: ">=1.6.0,<2.0.0"

test_scenarios:

  # REQUIRED: Default scenario with no custom variables
  - name: "Default"
    vars: {}
    include_incremental: false

  # Facebook and Google Ads enabled with demographics
  - name: "facebook google linkedin enabled"
    vars:
      ad_reporting__facebook_ads_enabled: true
      facebook_ads__using_demographics_country: true
      facebook_ads__using_demographics_region: true
      ad_reporting__google_ads_enabled: true
      ad_reporting__amazon_ads_enabled: false
      ad_reporting__apple_search_ads_enabled: false
      ad_reporting__linkedin_ads_enabled: true
      ad_reporting__microsoft_ads_enabled: false
      ad_reporting__pinterest_ads_enabled: false
      ad_reporting__reddit_ads_enabled: false
      ad_reporting__snapchat_ads_enabled: false
      ad_reporting__tiktok_ads_enabled: false
      ad_reporting__twitter_ads_enabled: false
    include_incremental: false
version: 2

models:

  - name: ad_reporting__account_report
    description: Each record represents daily metrics by account.
    columns:
      - name: source_relation
        description: '{{ doc("source_relation") }}'
      - name: date_day
        description: '{{ doc("date_day") }}'
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
        tests:
          - not_null:
              config:
                severity: warn
      - name: account_name
        description: '{{ doc("account_name") }}'
      - name: clicks
        description: '{{ doc("clicks") }}'
      - name: impressions
        description: '{{ doc("impressions") }}'
      - name: spend
        description: '{{ doc("spend") }}'
      - name: conversions
        description: '{{ doc("conversions") }}'
      - name: conversions_value
        description: '{{ doc("conversions_value") }}'

  - name: ad_reporting__ad_group_report
    description: Each record represents daily metrics by ad group, campaign and account.
    columns:
      - name: source_relation
        description: '{{ doc("source_relation") }}'
      - name: date_day
        description: '{{ doc("date_day") }}'
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_name
        description: '{{ doc("account_name") }}'
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
      - name: campaign_name
        description: '{{ doc("campaign_name") }}'
      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
        tests:
          - not_null
      - name: ad_group_name
        description: '{{ doc("ad_group_name") }}'
      - name: clicks
        description: '{{ doc("clicks") }}'
      - name: impressions
        description: '{{ doc("impressions") }}'
      - name: spend
        description: '{{ doc("spend") }}'
      - name: conversions
        description: '{{ doc("conversions") }}'
      - name: conversions_value
        description: '{{ doc("conversions_value") }}'

  - name: ad_reporting__ad_report
    description: Each record represents daily metrics by ad, ad group, campaign and account.
    semantic_model:
      enabled: true
      name: ad_report
    agg_time_dimension: date_day
    columns:
      - name: source_relation
        description: '{{ doc("source_relation") }}'

      - name: date_day
        description: '{{ doc("date_day") }}'
        granularity: day
        dimension:
          type: time

      - name: platform
        description: '{{ doc("platform") }}'
        dimension:
          type: categorical

      - name: account_id
        description: '{{ doc("account_id") }}'
        dimension:
          type: categorical

      - name: account_name
        description: '{{ doc("account_name") }}'
        dimension:
          type: categorical

      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        dimension:
          type: categorical

      - name: campaign_name
        description: '{{ doc("campaign_name") }}'
        dimension:
          type: categorical

      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
        dimension:
          type: categorical

      - name: ad_group_name
        description: '{{ doc("ad_group_name") }}'
        dimension:
          type: categorical

      - name: ad_id
        description: '{{ doc("ad_id") }}'
        tests:
          - not_null
        entity:
          type: primary
          name: ad

      - name: ad_name
        description: '{{ doc("ad_name") }}'
        dimension:
          type: categorical

      - name: clicks
        description: '{{ doc("clicks") }}'

      - name: impressions
        description: '{{ doc("impressions") }}'

      - name: spend
        description: '{{ doc("spend") }}'
        dimension:
          type: categorical

      - name: conversions
        description: '{{ doc("conversions") }}'

      - name: conversions_value
        description: '{{ doc("conversions_value") }}'


    metrics:
      - name: active_ads
        description: Count of ads witth spend > 0.
        type: simple
        filter: |
          {{Dimension('ad__spend')}} > 0
        label: 'Active Ads (Fivetran)'
        agg: count_distinct
        expr: ad_id

      - name: avg_spend_nonzero
        description: Average ad spend, ignores zero-spend days.
        type: simple
        filter: |
          {{Dimension('ad__spend')}} > 0
        label: 'Avg Spend Non-Zero (Fivetran)'
        agg: average
        expr: spend

      - name: avg_spend
        description: Average ad spend, does not ignore zero-spend days.
        type: simple
        label: 'Avg Spend (Fivetran)'
        agg: average
        expr: spend

      - name: clicks
        description: Total clicks
        type: simple
        label: 'Ad Clicks (Fivetran)'
        agg: sum
        expr: clicks

      - name: impressions
        description: Total impressions
        type: simple
        label: 'Ad Impressions (Fivetran)'
        agg: sum
        expr: impressions

      - name: spend
        description: Total spend (in currency of individual platforms)
        type: simple
        label: 'Ad Spend (Fivetran)'
        agg: sum
        expr: spend

      - name: clickthrough_rate
        description: Percentage of impressions that did convert into clicks.
        label: 'Ad Clickthrough Rate (Fivetran)'
        type: derived
        expr: clicks/impressions
        input_metrics:
          - name: clicks
          - name: impressions

      - name: cost_per_click
        description: The ratio of spend to clicks
        label: 'Average Ad Cost Per Click (Fivetran)'
        type: derived
        expr: spend/clicks
        input_metrics:
          - name: clicks
          - name: spend

      - name: bounce_rate
        description: Percentage of impressions that did not convert into clicks.
        label: 'Average Ad Bounce Rate (Fivetran)'
        type: derived
        expr: impressions - clicks/impressions
        input_metrics:
          - name: impressions
          - name: clicks


